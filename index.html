<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skokka - Post Free Classified Ads</title>
    <link rel="stylesheet" href="style.css?v=5">
    
    <!-- SEO & Google Verification Tags -->
    <meta name="description" content="Skokka - Post free classified ads online. Buy, sell, and find services near you on Skokka. Fast, easy, and 100% free classifieds website.">
    <meta name="keywords" content="skokka, skokka ads, free classifieds, post free ads, buy and sell online, local ads">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="ecfJROAx6B6sUJdC8uL6zLw6p95150wG9k3R8fG5Kms" />
</head>
<body>

    <header>
        <div class="logo">Skokka</div>
        <nav>
            <button id="loginNavBtn" onclick="openLoginModal()">Admin Login</button>
            <button id="logoutNavBtn" onclick="logoutAdmin()" style="display:none;">Logout Admin</button>
        </nav>
    </header>

    <!-- Admin Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">&times;</span>
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Admin Password">
            <button onclick="loginAdmin()">Login</button>
            <p id="loginError" style="color:red; display:none;">Incorrect Password!</p>
        </div>
    </div>

    <main>
        <!-- Ad Post Form with Image Upload -->
        <section class="ad-form-section">
            <h2>Post a New Ad</h2>
            <form id="adForm">
                <input type="text" id="adTitle" placeholder="Ad Title (e.g., iPhone 13 for Sale)" required>
                <textarea id="adDesc" placeholder="Ad Description / Details" rows="4" required></textarea>
                <input type="text" id="adContact" placeholder="Contact Number or Email" required>
                
                <!-- ఫోటో సెలెక్ట్ చేయడానికి కొత్త ఆప్షన్ -->
                <label style="display:block; margin: 15px 0 5px 0; font-weight:600; color:var(--secondary-color); text-align:left;">Upload Ad Image (Optional):</label>
                <input type="file" id="adImage" accept="image/*" style="background:none; border:none; padding:0;">
                
                <button type="submit" style="margin-top:15px;">Publish Ad</button>
            </form>
        </section>

        <!-- Ads Display Section -->
        <section class="ads-display-section">
            <h2>Recent Advertisements</h2>
            <div id="adsContainer">
                <!-- Ads will load here via JavaScript -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
